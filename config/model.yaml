# Model Configuration for LLM Extension
# Describes the open-weight LLM deployment used in the study

provider: "modal"
active_status: "active" # Modal CPU deployment enabled via authorized promotional credits ($0.00 out-of-pocket)

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16"
  hardware: "Modal CPU (4 vCPU, 8 GB RAM per container)"
  temperature: 0.7
  max_output_tokens: 12
  timeout_seconds: 3600
  max_retries: 1

state_abstraction:
  states: ["START", "ROCK", "PAPER", "SCISSORS", "TIE"]
  rule: "Strict plurality of round t-1 actions across 4 agents; TIE if ambiguous"

privacy_boundary:
  detector_logs: "Contains strictly round, public_state, and actions"
  evaluation_manifests: "Contains ground-truth condition, private signal, and decisions"
