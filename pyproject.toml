[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "when-correlation-lies"
version = "0.1.0"
description = "Stress-testing Pairwise Net Influence for detecting coordination among agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
report = [
    "reportlab>=4.0.0",
    "pymupdf>=1.24.0",
]
cloud = [
    "modal>=0.60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
